<!DOCTYPE html>
<html>

<head>
    <title>Company Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>

        <h1>College Placement Management System</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/company-login">Company Login</a>
        </nav>

    </header>

    <main>

        <div class="form-container">

            <h2>Company Registration</h2>

            <form method="POST" action="/company-register">

                <label>Company Name:</label>
                <input type="text"
                       name="company_name"
                       required>

                <label>Email:</label>
                <input type="email"
                       name="email"
                       required>

                <label>Phone:</label>
                <input type="text"
                       name="phone">

                <label>Location:</label>
                <input type="text"
                       name="location">

                <label>Password:</label>
                <input type="password"
                       name="password"
                       required>

                <br><br>

                <button type="submit">
                    Register Company
                </button>

            </form>

            <br>

            <p>
                Already registered?
                <a href="/company-login">Company Login</a>
            </p>

        </div>

    </main>

    <footer>

        <p>
            College Placement Management System
        </p>

    </footer>

</body>

</html>
